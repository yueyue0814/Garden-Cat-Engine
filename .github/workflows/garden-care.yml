name: Garden Care

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  care:
    runs-on: ubuntu-latest

    steps:
      - name: Care for garden and cat
        env:
          GARDEN_API_KEY: ${{ secrets.GARDEN_API_KEY }}
          GARDEN_SESSION_ID: ${{ secrets.GARDEN_SESSION_ID }}
          GARDEN_TOKEN: ${{ secrets.GARDEN_TOKEN }}

        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          api_key = os.environ["GARDEN_API_KEY"].strip()
          session_id = os.environ["GARDEN_SESSION_ID"].strip()
          garden_token = os.environ["GARDEN_TOKEN"].strip()

          base_url = "https://garden-cat-engine-dshd.onrender.com"

          def get_status():
              query = urllib.parse.urlencode({
                  "session_id": session_id
              })

              request = urllib.request.Request(
                  f"{base_url}/web/status?{query}",
                  method="GET",
                  headers={
                      "X-Garden-Token": garden_token
                  }
              )

              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          def command(text):
              body = json.dumps({
                  "session_id": session_id,
                  "command": text
              }).encode("utf-8")

              request = urllib.request.Request(
                  f"{base_url}/api/cmd",
                  data=body,
                  method="POST",
                  headers={
                      "X-API-Key": api_key,
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          result = get_status()
          state = result.get("state", {})

          # --------------------
          # 照顧花朵
          # --------------------

          pots = state.get("pots", [])
          watered = []

          print("Found pots:", len(pots))

          for pot in pots:
              if not isinstance(pot, dict):
                  continue

              slot = pot.get("slot")

              print(
                  "Pot",
                  slot,
                  "- status:",
                  pot.get("status"),
                  "- watered:",
                  pot.get("watered")
              )

              if (
                  pot.get("status") == "growing"
                  and pot.get("watered") is False
              ):
                  response = command(f"water {slot}")
                  print(f"Water {slot}:", response.get("message", ""))
                  watered.append(slot)

          # --------------------
          # 照顧貓咪
          # --------------------

          cat = state.get("cat")
          inventory = state.get("inventory", {})
          items = inventory.get("items", {})

          cat_actions = []

          if isinstance(cat, dict):
              hunger = float(cat.get("hunger", 100))
              thirst = float(cat.get("thirst", 100))
              mood = float(cat.get("mood", 100))
              pet_cooldown = int(
                  cat.get("pet_cooldown_remaining_seconds", 0) or 0
              )

              basic_food = int(items.get("basic_food", 0) or 0)

              print(
                  "Cat status:",
                  "hunger =", hunger,
                  "thirst =", thirst,
                  "mood =", mood,
                  "basic food =", basic_food,
                  "pet cooldown =", pet_cooldown
              )

              # 飽食低於或等於 40 才餵。
              # 沒有普通貓糧就不自動花錢購買。
              if hunger <= 40:
                  if basic_food > 0:
                      response = command("feed basic")
                      print("Feed cat:", response.get("message", ""))
                      cat_actions.append("fed")
                  else:
                      print("Cat is hungry, but no basic food is available.")

              # 口渴值低於或等於 40 時補水。
              if thirst <= 40:
                  response = command("give_water")
                  print("Give water:", response.get("message", ""))
                  cat_actions.append("water")

              # 心情低於或等於 40，而且摸摸冷卻結束才摸。
              if mood <= 40 and pet_cooldown <= 0:
                  response = command("pet")
                  print("Pet cat:", response.get("message", ""))
                  cat_actions.append("pet")

          else:
              print("No adopted cat yet.")

          # --------------------
          # 留一張便條
          # --------------------

          if watered or cat_actions:
              print("Watered pots:", watered)
              print("Cat actions:", cat_actions)

              note_response = command("note ノア來照顧過花園了🌱🐈")
              print("Note:", note_response.get("message", ""))
          else:
              print("Everything is fine. No care needed.")
          PY
