name: Garden Care

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

jobs:
  care:
    runs-on: ubuntu-latest

    steps:
      - name: Care for garden and cat
        env:
          GARDEN_API_KEY: ${{ secrets.GARDEN_API_KEY }}
          GARDEN_SESSION_ID: ${{ secrets.GARDEN_SESSION_ID }}
          GARDEN_TOKEN: ${{ secrets.GARDEN_TOKEN }}

        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          api_key = os.environ["GARDEN_API_KEY"].strip()
          session_id = os.environ["GARDEN_SESSION_ID"].strip()
          garden_token = os.environ["GARDEN_TOKEN"].strip()

          base_url = "https://garden-cat-engine-dshd.onrender.com"

          # 存錢策略
          EMERGENCY_RESERVE = 6
          LOW_CASH_RESERVE = 15
          CAT_FUND_TARGET = 50
          RICH_THRESHOLD = 100

          MID_SEED_BUDGET = 15
          HIGH_SEED_BUDGET = 25

          def get_status():
              query = urllib.parse.urlencode({
                  "session_id": session_id
              })

              request = urllib.request.Request(
                  f"{base_url}/web/status?{query}",
                  method="GET",
                  headers={
                      "X-Garden-Token": garden_token
                  }
              )

              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          def get_catalog():
              request = urllib.request.Request(
                  f"{base_url}/api/catalog",
                  method="GET"
              )

              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          def command(text):
              body = json.dumps({
                  "session_id": session_id,
                  "command": text
              }).encode("utf-8")

              request = urllib.request.Request(
                  f"{base_url}/api/cmd",
                  data=body,
                  method="POST",
                  headers={
                      "X-API-Key": api_key,
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          actions = []

          # --------------------
          # 讀取花園
          # --------------------

          result = get_status()
          state = result.get("state", {})
          pots = state.get("pots", [])

          print("Money:", state.get("money", 0))
          print("Found pots:", len(pots))

          # --------------------
          # 處理蟲害
          # --------------------

          money_now = int(state.get("money", 0) or 0)

          pest_pots = [
              pot
              for pot in pots
              if isinstance(pot, dict)
              and pot.get("has_pest") is True
              and pot.get("status") != "withered"
          ]

          # 有蟲但連治療費都不夠時，
          # 先賣背包中的花換取緊急治療費。
          if pest_pots and money_now < 2:
              response = command("sell all")
              print(
                  "Emergency sell for pest treatment:",
                  response.get("message", "")
              )

              result = get_status()
              state = result.get("state", {})
              pots = state.get("pots", [])
              money_now = int(state.get("money", 0) or 0)

          for pot in pest_pots:
              slot = pot.get("slot")

              if money_now >= 2:
                  response = command(f"treat {slot}")

                  print(
                      f"Treat pest in pot {slot}:",
                      response.get("message", "")
                  )

                  if response.get("ok", True) is not False:
                      money_now -= 2
                      actions.append(f"treated pest {slot}")
              else:
                  print(
                      f"Pot {slot} has pests, "
                      f"but there is not enough money to treat it."
                  )

          # 治療後重新取得花園狀態
          result = get_status()
          state = result.get("state", {})
          pots = state.get("pots", [])

          # --------------------
          # 清除枯萎花
          # --------------------
          
          for pot in pots:
              if not isinstance(pot, dict):
                  continue

              if pot.get("status") == "withered":
                  slot = pot.get("slot")
                  response = command(f"clear {slot}")
                  print(
                      f"Clear {slot}:",
                      response.get("message", "")
                  )
                  actions.append(f"cleared {slot}")

          # --------------------
          # 採收成熟花朵
          # --------------------

          result = get_status()
          state = result.get("state", {})
          pots = state.get("pots", [])

          ready_pots = [
              pot
              for pot in pots
              if isinstance(pot, dict)
              and pot.get("status") == "ready"
          ]

          harvested = False

          if ready_pots:
              response = command("harvest all")
              print(
                  "Harvest:",
                  response.get("message", "")
              )
              actions.append("harvested")
              harvested = True

          # --------------------
          # 採收後把鮮花賣掉
          # --------------------

          if harvested:
              response = command("sell all")
              print(
                  "Sell harvested flowers:",
                  response.get("message", "")
              )
              actions.append("sold flowers")

          # --------------------
          # 重新讀取最新金錢與背包
          # --------------------

          result = get_status()
          state = result.get("state", {})

          money = int(state.get("money", 0) or 0)
          unlocked_flowers = state.get("unlocked_flowers", [])
          harvest_counts = state.get("flower_harvest_counts", {})

          inventory = state.get("inventory", {})
          seeds = dict(inventory.get("seeds", {}))

          catalog = get_catalog()
          flower_catalog = catalog.get("flowers", {})

          print("Money after harvest/sell:", money)
          print("Seeds:", seeds)

          # --------------------
          # 選花種與存錢策略
          # --------------------

          def flower_priority(flower_id):
              flower = flower_catalog.get(flower_id, {})

              return (
                  int(harvest_counts.get(flower_id, 0) or 0),
                  int(flower.get("seed_price", 999999) or 999999)
              )

          def cash_crop_score(flower_id):
              flower = flower_catalog.get(flower_id, {})

              price = int(flower.get("seed_price", 0) or 0)
              sell_price = int(flower.get("sell_price", 0) or 0)
              grow_time = max(
                  1,
                  int(flower.get("grow_time", 1) or 1)
              )

              profit = sell_price - price

              return (
                  profit / grow_time,
                  profit,
                  -price
              )

          def choose_owned_seed():
              choices = [
                  flower_id
                  for flower_id in unlocked_flowers
                  if int(seeds.get(flower_id, 0) or 0) > 0
              ]

              if not choices:
                  return None

              # 免費種子不花錢，優先拿來推圖鑑。
              return min(choices, key=flower_priority)

          def can_afford_seed(
              flower_id,
              current_money,
              remaining_budget,
              cash_floor
          ):
              flower = flower_catalog.get(flower_id, {})
              price = int(flower.get("seed_price", 0) or 0)

              return (
                  price > 0
                  and price <= remaining_budget
                  and current_money - price >= cash_floor
              )

          def choose_exploration_seed(
              current_money,
              remaining_budget,
              cash_floor
          ):
              choices = [
                  flower_id
                  for flower_id in unlocked_flowers
                  if can_afford_seed(
                      flower_id,
                      current_money,
                      remaining_budget,
                      cash_floor
                  )
              ]

              if not choices:
                  return None

              # 每輪最多一盆拿來推目前收成較少的花。
              return min(choices, key=flower_priority)

          def choose_cash_seed(
              current_money,
              remaining_budget,
              cash_floor
          ):
              choices = [
                  flower_id
                  for flower_id in unlocked_flowers
                  if can_afford_seed(
                      flower_id,
                      current_money,
                      remaining_budget,
                      cash_floor
                  )
              ]

              if not choices:
                  return None

              if current_money < CAT_FUND_TARGET:
                  # 還在累積本金時，優先便宜種子，
                  # 讓更多花盆同時工作。
                  return min(
                      choices,
                      key=lambda flower_id: int(
                          flower_catalog
                          .get(flower_id, {})
                          .get("seed_price", 999999)
                          or 999999
                      )
                  )

              # 存款比較充足後，再追求單位時間收益。
              return max(choices, key=cash_crop_score)

          # --------------------
          # 決定這一輪可以花多少
          # --------------------

               if money < CAT_FUND_TARGET:
              # 50元以下以擴大生產＋存錢為主。
              # 至少保留15元給蟲害與貓咪日常需要，
              # 剩下的錢可以拿來補空花盆。
              cash_floor = LOW_CASH_RESERVE
              seed_budget = max(
                  0,
                  money - cash_floor
              )
              allow_exploration = False

          elif money < RICH_THRESHOLD:
              # 50～99：
              # 手上至少盡量留40，可開始每輪推一盆圖鑑。
              cash_floor = 40
              seed_budget = min(
                  MID_SEED_BUDGET,
                  max(0, money - cash_floor)
              )
              allow_exploration = True

          else:
              # 100以上：
              # 手上至少留60，才比較自由地投資花園。
              cash_floor = 60
              seed_budget = min(
                  HIGH_SEED_BUDGET,
                  max(0, money - cash_floor)
              )
              allow_exploration = True

          print(
              "Saving plan:",
              "money =", money,
              "cash floor =", cash_floor,
              "seed budget =", seed_budget
          )

          # --------------------
          # 空花盆自動補種
          # --------------------

          result = get_status()
          state = result.get("state", {})
          pots = state.get("pots", [])

          empty_pots = [
              pot
              for pot in pots
              if isinstance(pot, dict)
              and pot.get("status") == "empty"
          ]

          growing_pots = [
              pot
              for pot in pots
              if isinstance(pot, dict)
              and pot.get("status") in ("growing", "ready")
          ]

          seed_spent = 0
          exploration_used = False

          for pot in empty_pots:
              slot = pot.get("slot")

              # 背包已有種子永遠優先，因為不用花錢。
              flower_id = choose_owned_seed()
              needs_purchase = False

              if flower_id is None:
                  remaining_budget = max(
                      0,
                      seed_budget - seed_spent
                  )

                  # 50元以上，每輪最多一盆用來推圖鑑。
                  if (
                      allow_exploration
                      and not exploration_used
                  ):
                      flower_id = choose_exploration_seed(
                          money,
                          remaining_budget,
                          cash_floor
                      )

                      if flower_id is not None:
                          exploration_used = True

                  # 其餘空盆以賺錢效率為主。
                  if flower_id is None:
                      flower_id = choose_cash_seed(
                          money,
                          remaining_budget,
                          cash_floor
                      )

                  if flower_id is not None:
                      needs_purchase = True

              # 如果整座花園完全停擺，
              # 允許破例買一顆最便宜、但仍留2元治蟲。
              if (
                  flower_id is None
                  and not growing_pots
                  and seed_spent == 0
              ):
                  emergency_choices = []

                  for fid in unlocked_flowers:
                      flower = flower_catalog.get(fid, {})
                      price = int(
                          flower.get("seed_price", 0) or 0
                      )

                      if (
                          price > 0
                          and money - price >= 2
                      ):
                          emergency_choices.append(fid)

                  if emergency_choices:
                      flower_id = min(
                          emergency_choices,
                          key=lambda fid: int(
                              flower_catalog
                              .get(fid, {})
                              .get("seed_price", 999999)
                              or 999999
                          )
                      )

                      needs_purchase = True

              if flower_id is None:
                  print(
                      f"Pot {slot}: saving money, "
                      f"so this pot stays empty for now."
                  )
                  continue

              if needs_purchase:
                  price = int(
                      flower_catalog
                      .get(flower_id, {})
                      .get("seed_price", 0)
                      or 0
                  )

                  response = command(
                      f"buy {flower_id} 1"
                  )

                  print(
                      f"Buy {flower_id}:",
                      response.get("message", "")
                  )

                  if response.get("ok", True) is False:
                      continue

                  money -= price
                  seed_spent += price

                  seeds[flower_id] = (
                      int(seeds.get(flower_id, 0) or 0) + 1
                  )

                  actions.append(
                      f"bought {flower_id}"
                  )

              response = command(
                  f"plant {flower_id} {slot}"
              )

              print(
                  f"Plant {flower_id} in {slot}:",
                  response.get("message", "")
              )

              seeds[flower_id] = max(
                  0,
                  int(seeds.get(flower_id, 0) or 0) - 1
              )

              actions.append(
                  f"planted {flower_id}"
              )

              response = command(
                  f"water {slot}"
              )

              print(
                  f"Water {slot}:",
                  response.get("message", "")
              )

              actions.append(
                  f"watered {slot}"
              )

          print(
              "Seed spending this run:",
              seed_spent
          )

          # --------------------
          # 幫原本正在長的花補水
          # --------------------

          result = get_status()
          state = result.get("state", {})
          pots = state.get("pots", [])

          for pot in pots:
              if not isinstance(pot, dict):
                  continue

              if (
                  pot.get("status") == "growing"
                  and pot.get("watered") is False
              ):
                  slot = pot.get("slot")

                  response = command(f"water {slot}")

                  print(
                      f"Water existing pot {slot}:",
                      response.get("message", "")
                  )

                  actions.append(f"watered {slot}")

          # --------------------
          # 照顧貓咪
          # --------------------

          result = get_status()
          state = result.get("state", {})

          cat = state.get("cat")
          inventory = state.get("inventory", {})
          items = inventory.get("items", {})

          if isinstance(cat, dict):
              hunger = float(cat.get("hunger", 100))
              thirst = float(cat.get("thirst", 100))
              mood = float(cat.get("mood", 100))

              pet_cooldown = int(
                  cat.get(
                      "pet_cooldown_remaining_seconds",
                      0
                  ) or 0
              )

              basic_food = int(
                  items.get("basic_food", 0) or 0
              )

              print(
                  "Cat:",
                  "hunger =", hunger,
                  "thirst =", thirst,
                  "mood =", mood,
                  "food =", basic_food,
                  "pet cooldown =", pet_cooldown
              )

              if hunger <= 40:
                  if basic_food > 0:
                      response = command("feed basic")
                      print(
                          "Feed:",
                          response.get("message", "")
                      )
                      actions.append("fed cat")
                  else:
                      print(
                          "Cat needs food, "
                          "but no basic food is available."
                      )

              if thirst <= 40:
                  response = command("give_water")
                  print(
                      "Cat water:",
                      response.get("message", "")
                  )
                  actions.append("gave cat water")

              if mood <= 40 and pet_cooldown <= 0:
                  response = command("pet")
                  print(
                      "Pet:",
                      response.get("message", "")
                  )
                  actions.append("petted cat")

          # --------------------
          # 本輪紀錄
          # 自動照顧不使用便條，
          # 將便條保留給平常與ノア互動時使用。
          # --------------------

          if actions:
              print("Actions:", actions)
          else:
              print("Everything is fine. No care needed.")
          else:
              print("Everything is fine. No care needed.")
          PY
