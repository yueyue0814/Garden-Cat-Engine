name: Garden Care

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  care:
    runs-on: ubuntu-latest

    steps:
      - name: Check and water garden
        env:
          GARDEN_API_KEY: ${{ secrets.GARDEN_API_KEY }}
          GARDEN_SESSION_ID: ${{ secrets.GARDEN_SESSION_ID }}

        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          api_key = os.environ["GARDEN_API_KEY"].strip()
          session_id = os.environ["GARDEN_SESSION_ID"].strip()

          base_url = "https://garden-cat-engine-dshd.onrender.com"

          def get_status():
              query = urllib.parse.urlencode({
                  "session_id": session_id
              })

              request = urllib.request.Request(
                  f"{base_url}/api/status?{query}",
                  method="GET",
                  headers={
                      "X-API-Key": api_key
                  }
              )

              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          def command(text):
              body = json.dumps({
                  "session_id": session_id,
                  "command": text
              }).encode("utf-8")

              request = urllib.request.Request(
                  f"{base_url}/api/cmd",
                  data=body,
                  method="POST",
                  headers={
                      "X-API-Key": api_key,
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          result = get_status()

          print("Top-level keys:", list(result.keys()))

          for key in ("state", "summary", "data"):
              if isinstance(result.get(key), dict):
                  print(f"{key} keys:", list(result[key].keys()))

          state = result.get("state", result)
          pots = state.get("pots", [])

          watered = []

          for pot in pots:
              print(
                  "Pot",
                  pot.get("slot"),
                  "- status:",
                  pot.get("status"),
                  "- watered:",
                  pot.get("watered")
              )

              if (
                  pot.get("status") == "growing"
                  and pot.get("watered") is False
              ):
                  slot = pot.get("slot")
                  command(f"water {slot}")
                  watered.append(slot)

          if watered:
              print("Watered pots:", watered)
              command("note ノア來澆過水了🌱")
          else:
              print("No pots need watering.")
          PY
