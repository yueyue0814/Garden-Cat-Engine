name: Garden Care

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

jobs:
  care:
    runs-on: ubuntu-latest

    steps:
      - name: Care for garden and cat
        env:
          GARDEN_API_KEY: ${{ secrets.GARDEN_API_KEY }}
          GARDEN_SESSION_ID: ${{ secrets.GARDEN_SESSION_ID }}
          GARDEN_TOKEN: ${{ secrets.GARDEN_TOKEN }}

        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          api_key = os.environ["GARDEN_API_KEY"].strip()
          session_id = os.environ["GARDEN_SESSION_ID"].strip()
          garden_token = os.environ["GARDEN_TOKEN"].strip()

          base_url = "https://garden-cat-engine-dshd.onrender.com"

          # 平常盡量留一點零用錢。
          MONEY_RESERVE = 20

          def get_status():
              query = urllib.parse.urlencode({
                  "session_id": session_id
              })

              request = urllib.request.Request(
                  f"{base_url}/web/status?{query}",
                  method="GET",
                  headers={
                      "X-Garden-Token": garden_token
                  }
              )

              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          def get_catalog():
              request = urllib.request.Request(
                  f"{base_url}/api/catalog",
                  method="GET"
              )

              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          def command(text):
              body = json.dumps({
                  "session_id": session_id,
                  "command": text
              }).encode("utf-8")

              request = urllib.request.Request(
                  f"{base_url}/api/cmd",
                  data=body,
                  method="POST",
                  headers={
                      "X-API-Key": api_key,
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          actions = []

          # --------------------
          # 讀取花園
          # --------------------

          result = get_status()
          state = result.get("state", {})
          pots = state.get("pots", [])

          print("Money:", state.get("money", 0))
          print("Found pots:", len(pots))

          # --------------------
          # 清除枯萎花
          # --------------------

          for pot in pots:
              if not isinstance(pot, dict):
                  continue

              if pot.get("status") == "withered":
                  slot = pot.get("slot")
                  response = command(f"clear {slot}")
                  print(
                      f"Clear {slot}:",
                      response.get("message", "")
                  )
                  actions.append(f"cleared {slot}")

          # --------------------
          # 採收成熟花朵
          # --------------------

          result = get_status()
          state = result.get("state", {})
          pots = state.get("pots", [])

          ready_pots = [
              pot
              for pot in pots
              if isinstance(pot, dict)
              and pot.get("status") == "ready"
          ]

          harvested = False

          if ready_pots:
              response = command("harvest all")
              print(
                  "Harvest:",
                  response.get("message", "")
              )
              actions.append("harvested")
              harvested = True

          # --------------------
          # 採收後把鮮花賣掉
          # --------------------

          if harvested:
              response = command("sell all")
              print(
                  "Sell harvested flowers:",
                  response.get("message", "")
              )
              actions.append("sold flowers")

          # --------------------
          # 重新讀取最新金錢與背包
          # --------------------

          result = get_status()
          state = result.get("state", {})

          money = int(state.get("money", 0) or 0)
          unlocked_flowers = state.get("unlocked_flowers", [])
          harvest_counts = state.get("flower_harvest_counts", {})

          inventory = state.get("inventory", {})
          seeds = dict(inventory.get("seeds", {}))

          catalog = get_catalog()
          flower_catalog = catalog.get("flowers", {})

          print("Money after harvest/sell:", money)
          print("Seeds:", seeds)

          # --------------------
          # 選花種
          # 優先累計收成較少的花
          # --------------------

          def flower_priority(flower_id):
              flower = flower_catalog.get(flower_id, {})

              return (
                  int(harvest_counts.get(flower_id, 0) or 0),
                  int(flower.get("seed_price", 999999) or 999999)
              )

          def choose_owned_seed():
              choices = [
                  flower_id
                  for flower_id in unlocked_flowers
                  if int(seeds.get(flower_id, 0) or 0) > 0
              ]

              if not choices:
                  return None

              return min(choices, key=flower_priority)

          def choose_seed_to_buy(current_money, keep_reserve=True):
              choices = []

              for flower_id in unlocked_flowers:
                  flower = flower_catalog.get(flower_id, {})
                  price = int(flower.get("seed_price", 0) or 0)

                  if price <= 0:
                      continue

                  if keep_reserve:
                      if current_money - price < MONEY_RESERVE:
                          continue
                  else:
                      if current_money < price:
                          continue

                  choices.append(flower_id)

              if not choices:
                  return None

              return min(choices, key=flower_priority)

          # --------------------
          # 空花盆自動補種
          # --------------------

          result = get_status()
          state = result.get("state", {})
          pots = state.get("pots", [])

          empty_pots = [
              pot
              for pot in pots
              if isinstance(pot, dict)
              and pot.get("status") == "empty"
          ]

          growing_pots = [
              pot
              for pot in pots
              if isinstance(pot, dict)
              and pot.get("status") in ("growing", "ready")
          ]

          sold_for_emergency = harvested

          for pot in empty_pots:
              slot = pot.get("slot")

              flower_id = choose_owned_seed()

              # 沒有現成種子，先嘗試保留 20 元來買。
              if flower_id is None:
                  flower_id = choose_seed_to_buy(
                      money,
                      keep_reserve=True
                  )

              # 如果完全沒有種子，而且花園已經沒有花在長，
              # 允許動用緊急預備金買一包最便宜可負擔的種子。
              if (
                  flower_id is None
                  and not growing_pots
              ):
                  flower_id = choose_seed_to_buy(
                      money,
                      keep_reserve=False
                  )

              # 還是沒錢時，嘗試再賣一次背包中的鮮花。
              if (
                  flower_id is None
                  and not sold_for_emergency
              ):
                  response = command("sell all")
                  print(
                      "Emergency sell:",
                      response.get("message", "")
                  )
                  sold_for_emergency = True

                  result = get_status()
                  state = result.get("state", {})
                  money = int(state.get("money", 0) or 0)

                  inventory = state.get("inventory", {})
                  seeds = dict(inventory.get("seeds", {}))

                  print("Money after emergency sell:", money)

                  flower_id = choose_owned_seed()

                  if flower_id is None:
                      flower_id = choose_seed_to_buy(
                          money,
                          keep_reserve=True
                      )

                  if (
                      flower_id is None
                      and not growing_pots
                  ):
                      flower_id = choose_seed_to_buy(
                          money,
                          keep_reserve=False
                      )

              if flower_id is None:
                  print(
                      f"Pot {slot}: still cannot afford a seed."
                  )
                  continue

              # 如果背包沒有這顆種子，就買一顆。
              if int(seeds.get(flower_id, 0) or 0) <= 0:
                  price = int(
                      flower_catalog
                      .get(flower_id, {})
                      .get("seed_price", 0)
                      or 0
                  )

                  response = command(f"buy {flower_id} 1")
                  print(
                      f"Buy {flower_id}:",
                      response.get("message", "")
                  )

                  money -= price
                  seeds[flower_id] = 1
                  actions.append(f"bought {flower_id}")

              response = command(
                  f"plant {flower_id} {slot}"
              )

              print(
                  f"Plant {flower_id} in {slot}:",
                  response.get("message", "")
              )

              seeds[flower_id] = max(
                  0,
                  int(seeds.get(flower_id, 0) or 0) - 1
              )

              actions.append(f"planted {flower_id}")

              response = command(f"water {slot}")

              print(
                  f"Water {slot}:",
                  response.get("message", "")
              )

              actions.append(f"watered {slot}")

          # --------------------
          # 幫原本正在長的花補水
          # --------------------

          result = get_status()
          state = result.get("state", {})
          pots = state.get("pots", [])

          for pot in pots:
              if not isinstance(pot, dict):
                  continue

              if (
                  pot.get("status") == "growing"
                  and pot.get("watered") is False
              ):
                  slot = pot.get("slot")

                  response = command(f"water {slot}")

                  print(
                      f"Water existing pot {slot}:",
                      response.get("message", "")
                  )

                  actions.append(f"watered {slot}")

          # --------------------
          # 照顧貓咪
          # --------------------

          result = get_status()
          state = result.get("state", {})

          cat = state.get("cat")
          inventory = state.get("inventory", {})
          items = inventory.get("items", {})

          if isinstance(cat, dict):
              hunger = float(cat.get("hunger", 100))
              thirst = float(cat.get("thirst", 100))
              mood = float(cat.get("mood", 100))

              pet_cooldown = int(
                  cat.get(
                      "pet_cooldown_remaining_seconds",
                      0
                  ) or 0
              )

              basic_food = int(
                  items.get("basic_food", 0) or 0
              )

              print(
                  "Cat:",
                  "hunger =", hunger,
                  "thirst =", thirst,
                  "mood =", mood,
                  "food =", basic_food,
                  "pet cooldown =", pet_cooldown
              )

              if hunger <= 40:
                  if basic_food > 0:
                      response = command("feed basic")
                      print(
                          "Feed:",
                          response.get("message", "")
                      )
                      actions.append("fed cat")
                  else:
                      print(
                          "Cat needs food, "
                          "but no basic food is available."
                      )

              if thirst <= 40:
                  response = command("give_water")
                  print(
                      "Cat water:",
                      response.get("message", "")
                  )
                  actions.append("gave cat water")

              if mood <= 40 and pet_cooldown <= 0:
                  response = command("pet")
                  print(
                      "Pet:",
                      response.get("message", "")
                  )
                  actions.append("petted cat")

          # --------------------
          # 有實際做事情才留便條
          # --------------------

          if actions:
              print("Actions:", actions)

              note_response = command(
                  "note ノア來整理過花園了🌱🐈"
              )

              print(
                  "Note:",
                  note_response.get("message", "")
              )
          else:
              print("Everything is fine. No care needed.")
          PY
