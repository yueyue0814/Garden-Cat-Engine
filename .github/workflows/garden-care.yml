name: Garden Care

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  care:
    runs-on: ubuntu-latest

    steps:
      - name: Check and water garden
        env:
          GARDEN_API_KEY: ${{ secrets.GARDEN_API_KEY }}
          GARDEN_SESSION_ID: ${{ secrets.GARDEN_SESSION_ID }}

        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          api_key = os.environ["GARDEN_API_KEY"].strip()
          session_id = os.environ["GARDEN_SESSION_ID"].strip()

          base_url = "https://garden-cat-engine-dshd.onrender.com"

          def command(text):
              body = json.dumps({
                  "session_id": session_id,
                  "command": text
              }).encode("utf-8")

              request = urllib.request.Request(
                  f"{base_url}/api/cmd",
                  data=body,
                  method="POST",
                  headers={
                      "X-API-Key": api_key,
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          def get_state():
              query = urllib.parse.urlencode({
                  "session_id": session_id
              })

              request = urllib.request.Request(
                  f"{base_url}/api/state?{query}",
                  method="GET",
                  headers={
                      "X-API-Key": api_key
                  }
              )

              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          # 先讓遊戲結算目前狀態
          command("status")

          result = get_state()
          state = result.get("state", result)
          pots = state.get("pots", [])

          print("Found pots:", len(pots))

          watered = []

          for slot, pot in enumerate(pots, start=1):
              if not isinstance(pot, dict):
                  continue

              print(
                  "Pot",
                  slot,
                  "- flower:",
                  pot.get("flower_id"),
                  "- watered:",
                  pot.get("watered")
              )

              if pot.get("watered") is False:
                  response = command(f"water {slot}")
                  print(f"Water {slot}:", response.get("message", ""))
                  watered.append(slot)

          if watered:
              print("Watered pots:", watered)
              command("note ノア來澆過水了🌱")
          else:
              print("No pots need watering.")
          PY
